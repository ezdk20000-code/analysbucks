# Основные настройки AnalysBucks.
# Все суммы — в валюте банка (например, рубли или доллары — как вам удобно).

# Лиги (код football-data.co.uk). Бэктест 2012–2026: 16 лиг дают в 6 раз больше
# value-ставок, чем 2 лиги, и CLV +3…5% в каждой — поэтому банк растёт гораздо быстрее.
leagues:
  EPL: E0           # Англия, Премьер-лига
  LaLiga: SP1       # Испания, Ла Лига
  Bundesliga: D1    # Германия
  SerieA: I1        # Италия
  Ligue1: F1        # Франция
  Eredivisie: N1    # Нидерланды
  Portugal: P1      # Португалия
  Belgium: B1       # Бельгия
  Turkey: T1        # Турция
  Greece: G1        # Греция
  Scotland: SC0     # Шотландия
  Championship: E1  # Англия, Чемпионшип
  Bundesliga2: D2   # Германия, 2-я лига
  SerieB: I2        # Италия, Серия B
  Segunda: SP2      # Испания, Сегунда
  Ligue2: F2        # Франция, Лига 2

# Первый сезон истории для обучения (формат football-data: 1920 = 2019/20).
first_season: 1112

model:
  # Сколько дней «полураспада» веса старых матчей в рейтингах Dixon–Coles.
  half_life_days: 240
  # Сколько дней истории брать для подгонки рейтингов.
  history_days: 1100
  # Доля реальных голов в целевой метрике (остальное — «xG-прокси» по ударам).
  goals_weight: 0.6
  # Регуляризация рейтингов атаки/защиты (больше = сильнее тянем к среднему).
  ridge: 0.02
  # Смешивание с рынком: итоговая вероятность = w*модель + (1-w)*рынок.
  # 1.0 — чистая модель, 0.0 — чистый рынок (средний кэф без маржи, степенной метод).
  # Бэктест 2012–2026: рынок точнее модели (log-loss 0.958 против 0.972), смесь не
  # помогает — поэтому 0. Модель остаётся «вторым мнением» и для матчей без линии.
  market_weight: 0.0
  # Использовать погоду (Open-Meteo) как признак и за сколько последних сезонов её качать.
  use_weather: true
  weather_seasons: 3

betting:
  # Источник коэффициента, по которому «ставим» в бэктесте: avg | max | b365
  # max = лучший коэффициент среди букмекеров (line shopping) — ключ к прибыли.
  price_source: max
  markets: [1X2, OU25]
  min_edge: 0.02        # минимальный перевес (p*k - 1), ниже — не ставим
  max_edge: 0.30        # слишком большой перевес — чаще ошибка модели/данных
  min_odds: 1.20
  max_odds: 2.50
  one_bet_per_match: true

# Экспрессы: собираются только из событий с положительным перевесом.
express:
  enabled: true
  legs: 3                 # событий в экспрессе (бэктест: 2–3 лучше, чем 4+)
  max_per_week: 1         # экспрессов в неделю
  min_leg_edge: 0.0       # минимальный перевес каждого события
  leg_min_odds: 1.20
  leg_max_odds: 1.70      # коридор фаворитов
  markets: [1X2]

staking:
  # Стратегия: kelly | percent | flat
  strategy: kelly
  kelly_fraction: 0.25        # «четверть Келли» — стандарт для живых денег
  percent: 0.01               # для strategy=percent: 1% текущего банка
  flat_unit: 0.01             # для strategy=flat: 1% стартового банка
  max_stake_pct: 0.03         # максимум на одну ставку — 3% банка
  max_express_pct: 0.01       # максимум на один экспресс — 1% банка
  max_daily_exposure_pct: 0.15  # максимум суммарно в один день — 15% банка
  # Тормоз при просадке: если банк ниже пика на X, режем ставки вдвое.
  drawdown_brake: 0.20
  # Стоп: если банк упал ниже доли от стартового — система перестаёт ставить.
  stop_loss_pct: 0.50
  min_stake: 1.0              # минимальная ставка букмекера (в валюте банка)

backtest:
  start_bank: 1000
  start_season: 1213          # с какого сезона симулировать ставки
  monte_carlo_runs: 2000

telegram:
  # Токен и разрешённые чаты — в .env (TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_CHATS)
  poll_timeout: 30
